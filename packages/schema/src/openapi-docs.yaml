# Documentation overlays only. Routes and schemas are generated from contracts.ts.
openapi: 3.1.0
info:
  title: OpenParser API
  version: 1.0.0
  description: "OpenParser API for document parsing and schema-constrained extraction.\n\nAuthentication uses Eigenpal bearer API keys. The authenticated key resolves\n`tenant_id` server-side; clients must not supply tenant identifiers. API keys must carry\nthe platform wildcard (`*`) or the dedicated `ocr:full` scope. Missing or unrelated\nscopes grant none. Admission requests are rate limited per organization (tenant),\nnot per API key.\n\nEvery parse or extract `POST` requires an `Idempotency-Key` header. Repeating the same tenant, operation,\nand idempotency key returns the same durable job or terminal result. Reusing the key with a\ndifferent request body returns `409`.\n\nParse and file-backed extract admission accepts **either** a direct multipart file upload\n**or** an Eigenpal reusable file-pool id (`file_id` from `POST /files`). Single-document\nextract additionally accepts `parse_job_id`, referencing a tenant-owned succeeded canonical\nparse job; it is mutually exclusive with file bytes and `file_id`. `parse_job_id` is not\naccepted by extract batch items. Arbitrary source URLs and presigned third-party URLs are\nnot accepted. Cross-tenant or unknown `file_id` / `parse_job_id` values return `404`.\nReferenced file bytes are copied into dedicated OCR object storage; OCR admission never\ncreates Eigenpal `files` table rows.\n\nParse and extract operations have **no hidden automatic retry**, **no fallback model**,\n**no hidden repair beyond the explicit `repair_attempts` bound**, and **no chunking or\ntruncation** beyond documented limits.\n\nSynchronous endpoints create durable jobs, wait up to the configured sync wait limit\n(default 300 seconds; deployment-tunable, not a client-selectable hard maximum), and\nreturn the terminal result when ready:\n- `200` with the raw terminal body (`ParsedDocument` for parse; `ExtractionTerminalResult`\n  for extract) on success;\n- `422` `ErrorResponse` when the durable job reaches terminal `failed` within the wait\n  window (in addition to admission-time unprocessable configuration);\n- `504` `ErrorResponse` when the durable job reaches terminal `indeterminate` within the\n  wait window;\n- `202` with a durable job reference if the wait limit expires first.\n\nDisconnecting does not cancel work. Cancellation is not part of this API version.\nAccepted (`202`) responses include a `Location` header that may be an absolute URI or a\npath-absolute relative reference to `GET /jobs/{id}`.\n\n`429` and `503` responses include `Retry-After` with a suggested wait in seconds before\nretrying admission. HTTP `503` is reserved for API admission dependency failures (for\nexample OCR source object upload). Transient GPU/HPS unavailability does **not** reject\nknown-model admission; jobs remain durable and queued until a ready replica and worker\ncapacity exist. Tenant concurrency caps and queue-age alarms bound and observe backlog.\n\n**Billing (customer page charge):** parse and file-backed extract charge **USD $0.001 per\nsuccessfully parsed page** ($1 per 1,000 pages; **0.1 shared-ledger credits per page** at\nthe fixed $0.01/credit presentation unit). The authoritative page count is the HPS/parse\nresult `page_count` on the canonical `ParsedDocument`. A single extract admitted with\n`parse_job_id` reuses that document, does not run OCR, and applies **no additional page\ncharge**; its provider-accepted OpenRouter attempts remain billable. No page charge applies\nbefore a successful terminal result is published and made retrievable. A job that terminates as `failed` or `indeterminate` incurs zero page charge, including an extract job that parsed successfully but did not publish a successful extraction result. Client disconnection after admission does not suppress a charge when the durable job later publishes a retrievable\nsuccessful result. Provider-accepted OpenRouter extraction attempts are billed separately\nat the customer retail token rates published by `GET /models/llm` (see `attempts` / `usage`\non `ExtractionTerminalResult`). Catalog `prompt_usd_per_1m` / `completion_usd_per_1m`\nfields are **customer retail** rates (`basis: customer_retail`), not raw provider list\nprices. Batches charge per child job. Page charges use the OCR model's customer retail\n`usd_per_page` (currently $0.001 for PaddleOCR-VL 1.6). Charge keys are idempotent. Credit reserve/refund behavior integrates with\nEigenpal billing and is not embedded in sync parse response bodies.\n\nAdmission does not limit document page count. Other document limits: **50 MiB per file**, **100 million\nrendered pixels per page**, and **100 MiB aggregate batch input** across multipart uploads\nand resolved `file_id` bytes. Reusable file-pool uploads accept up to **100 MiB**. Supported media\ntypes: **PDF**, **PNG**, **JPEG**. Encrypted PDFs are rejected. Archives, SVG, HTML, and other\nformats are rejected.\n"
servers:
  - url: 'https://{ocr_host}'
    description: Dedicated OCR hostname (environment-specific deployment value)
    variables:
      ocr_host:
        default: api.openparser.dev
        enum:
          - api.openparser.dev
          - sapi.openparser.dev
tags:
  - name: parse
    description: OCR parsing to the versioned `openparser@1` format or opt-in raw Paddle output
  - name: extract
    description: Parse plus schema-constrained LLM extraction
  - name: pipelines
    description: Tenant-scoped saved extraction configurations reusable via `pipeline_id`
  - name: models
    description: OCR and LLM model discovery for parse/extract
  - name: jobs
    description: Durable job status and results
  - name: files
    description: Tenant-scoped reusable input files
security:
  - bearerAuth: []
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      description: Existing Eigenpal API key presented as a bearer token.
  parameters:
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      description: "Client-supplied idempotency key. Required on every parse or extract `POST`. Must be unique per distinct\nrequest body for a given tenant and operation.\n"
      schema:
        type: string
        minLength: 1
        maxLength: 256
      example: 7f9f2f3d-0f8a-4f0a-9a2b-2f6f0a7d2c11
    JobId:
      name: id
      in: path
      required: true
      description: Durable OCR job identifier (`opj_…`).
      schema:
        $ref: '#/components/schemas/JobId'
    FileId:
      name: id
      in: path
      required: true
      description: Tenant-scoped reusable file identifier.
      schema:
        type: string
        minLength: 1
    PipelineId:
      name: id
      in: path
      required: true
      description: Tenant-scoped saved extraction pipeline identifier (`oppl_…`).
      schema:
        $ref: '#/components/schemas/ExtractionPipelineId'
    ChildCursor:
      name: cursor
      in: query
      required: false
      description: Opaque pagination cursor for batch child summaries.
      schema:
        type: string
        minLength: 1
    ChildLimit:
      name: limit
      in: query
      required: false
      description: Maximum number of batch child summaries to return.
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 50
    JobListCursor:
      name: cursor
      in: query
      required: false
      description: |
        Opaque pagination cursor from a prior `JobListResponse.next_cursor`. Jobs are
        returned newest-first (`created_at` descending, `id` descending tie-break).
      schema:
        type: string
        minLength: 1
    JobListLimit:
      name: limit
      in: query
      required: false
      description: Maximum number of job summaries to return.
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 25
    JobListStatus:
      name: status
      in: query
      required: false
      description: |
        Optional filter by public job status. Admission-phase (`admitting`) jobs are
        never listed.
      schema:
        $ref: '#/components/schemas/JobStatus'
    JobListOperation:
      name: operation
      in: query
      required: false
      description: Optional filter by job operation.
      schema:
        $ref: '#/components/schemas/JobOperation'
    ParseResultFormat:
      name: format
      in: query
      required: false
      description: |
        Parse representation to return. Defaults to the job's original `output_format`
        when omitted. Fresh parses store both representations as immutable object-store
        artifacts; historical jobs only expose the representation already present in
        `result_json`. Requesting an unavailable alternate returns `422` and never
        re-runs OCR.
      schema:
        $ref: '#/components/schemas/OcrOutputFormat'
    LlmModelsMode:
      name: mode
      in: query
      required: false
      description: |
        `suggested` (default): short recommended subset.
        `search`: full compatible catalog filtered by `q`.
      schema:
        type: string
        enum:
          - suggested
          - search
        default: suggested
    LlmModelsQuery:
      name: q
      in: query
      required: false
      description: Case-insensitive substring match against id, label, or provider. Used with `mode=search`.
      schema:
        type: string
        maxLength: 200
    LlmModelsPage:
      name: page
      in: query
      required: false
      description: 1-based page index when paginating search results.
      schema:
        type: integer
        minimum: 1
        default: 1
    LlmModelsLimit:
      name: limit
      in: query
      required: false
      description: Page size for search; ignored for suggested mode (bounded server-side).
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 25
  requestBodies:
    ParseSingleUpload:
      required: true
      content:
        multipart/form-data:
          schema:
            type: object
            required:
              - request
            properties:
              file:
                type: string
                format: binary
                description: "Source document bytes (PDF, PNG, or JPEG). Required unless `request.file_id`\nreferences an existing Eigenpal reusable file.\n"
              request:
                $ref: '#/components/schemas/ParseRequest'
          encoding:
            request:
              contentType: application/json
    ExtractSingleUpload:
      required: true
      content:
        multipart/form-data:
          schema:
            type: object
            required:
              - request
            properties:
              file:
                type: string
                format: binary
                description: "Source document bytes (PDF, PNG, or JPEG). Required unless `request.file_id`\nreferences an existing Eigenpal reusable file.\n"
              request:
                $ref: '#/components/schemas/ExtractRequest'
          encoding:
            request:
              contentType: application/json
    ParseBatchUpload:
      required: true
      content:
        multipart/form-data:
          schema:
            type: object
            required:
              - request
            properties:
              files:
                type: array
                minItems: 1
                maxItems: 100
                items:
                  type: string
                  format: binary
                description: "Ordered uploaded files referenced by `file_index` in the batch request. Each file\nis limited to 50 MiB and total multipart body content is limited to 100 MiB.\nOmit when every batch item supplies `file_id` instead.\n"
              request:
                $ref: '#/components/schemas/ParseBatchRequest'
          encoding:
            files:
              style: form
              explode: true
            request:
              contentType: application/json
    ExtractBatchUpload:
      required: true
      content:
        multipart/form-data:
          schema:
            type: object
            required:
              - request
            properties:
              files:
                type: array
                minItems: 1
                maxItems: 100
                items:
                  type: string
                  format: binary
                description: "Ordered uploaded files referenced by `file_index` in the batch request. Each file\nis limited to 50 MiB and total multipart body content is limited to 100 MiB.\nOmit when every batch item supplies `file_id` instead.\n"
              request:
                $ref: '#/components/schemas/ExtractBatchRequest'
          encoding:
            files:
              style: form
              explode: true
            request:
              contentType: application/json
    SuggestSchemaRequest:
      required: true
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/SuggestSchemaRequest'
    CreateExtractionPipelineRequest:
      required: true
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/CreateExtractionPipelineRequest'
    UpdateExtractionPipelineRequest:
      required: true
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/UpdateExtractionPipelineRequest'
  responses:
    JobAccepted:
      description: "Durable non-terminal job admitted. Returned by async endpoints and by sync endpoints when\nthe wait limit expires before a terminal status.\n"
      headers:
        Location:
          description: "Job resource URL for `GET /jobs/{id}`. May be an absolute URI or a path-absolute\nrelative reference (for example `/jobs/{id}`). Required on accepted (`202`)\nresponses.\n"
          schema:
            type: string
          example: /jobs/opj_7f9f2f3d0f8a4f0a9a2b2f6f0a7d2c11
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/JobAccepted'
          examples:
            queued:
              value:
                id: opj_7f9f2f3d0f8a4f0a9a2b2f6f0a7d2c11
                operation: parse
                status: queued
                output_format: 'openparser@1'
                created_at: 2026-07-17T12:00:00Z
                updated_at: 2026-07-17T12:00:00Z
    BatchJobAccepted:
      description: "Durable batch job admitted. `Location` points at the parent batch job resource.\n"
      headers:
        Location:
          description: "Batch job resource URL for `GET /jobs/{id}`. May be an absolute URI or a\npath-absolute relative reference (for example `/jobs/{id}`). Required on accepted\n(`202`) responses.\n"
          schema:
            type: string
          example: /jobs/opj_b2c3d4e56f7a8901bcdef23456789012
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/BatchJobAccepted'
          examples:
            queued:
              value:
                id: opj_b2c3d4e56f7a8901bcdef23456789012
                operation: parse_batch
                status: queued
                output_format: 'openparser@1'
                created_at: 2026-07-17T12:00:00Z
                updated_at: 2026-07-17T12:00:00Z
                child_count: 2
    MalformedRequest:
      description: Malformed request
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          examples:
            malformed:
              value:
                error:
                  code: malformed_request
                  message: 'multipart field `request` is not valid JSON'
                  request_id: req_01h2example
                  retryable: false
    Unauthorized:
      description: Missing or invalid API key
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          examples:
            unauthorized:
              value:
                error:
                  code: unauthorized
                  message: invalid API key
                  request_id: req_01h2example
                  retryable: false
    Forbidden:
      description: API key lacks required OCR scope (`*` or `ocr:full`)
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          examples:
            forbidden:
              value:
                error:
                  code: forbidden
                  message: API key lacks required scope
                  request_id: req_01h2example
                  retryable: false
    FileNotFound:
      description: File not found (including cross-tenant identifiers)
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          examples:
            missing:
              value:
                error:
                  code: file_not_found
                  message: file not found
                  request_id: req_01h2example
                  retryable: false
    InsufficientCredits:
      description: Billing or credits check failed
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          examples:
            billing:
              value:
                error:
                  code: insufficient_credits
                  message: tenant has insufficient credits for admission
                  request_id: req_01h2example
                  retryable: false
    IdempotencyConflict:
      description: Idempotency key reused with a different request
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          examples:
            conflict:
              value:
                error:
                  code: idempotency_conflict
                  message: Idempotency-Key was already used with a different request body
                  request_id: req_01h2example
                  retryable: false
    PipelineNameConflict:
      description: Pipeline name or slug already exists for the authenticated tenant
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          examples:
            conflict:
              value:
                error:
                  code: pipeline_name_conflict
                  message: pipeline name already exists
                  request_id: req_01h2example
                  retryable: false
                  details:
                    field: name
    LimitExceeded:
      description: Document or request limits exceeded
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          examples:
            bytes:
              value:
                error:
                  code: limit_exceeded
                  message: source exceeds 50 MiB admission limit
                  request_id: req_01h2example
                  retryable: false
                  details:
                    limit: max_input_bytes
                    max_value: 52428800
    UnsupportedMediaType:
      description: Unsupported uploaded media type
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          examples:
            media:
              value:
                error:
                  code: unsupported_media_type
                  message: 'only PDF, PNG, and JPEG uploads are accepted'
                  request_id: req_01h2example
                  retryable: false
    UnprocessableConfig:
      description: 'Invalid schema, configuration, encrypted PDF, unsupported OCR model, or unsupported LLM model'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          examples:
            unsupportedModel:
              value:
                error:
                  code: unsupported_ocr_model
                  message: unknown OCR model registry name
                  request_id: req_01h2example
                  retryable: false
                  details:
                    ocr_model: paddleocr-vl-9.9
            unsupportedLlmModel:
              value:
                error:
                  code: unsupported_llm_model
                  message: unknown or deprecated LLM model
                  request_id: req_01h2example
                  retryable: false
                  details:
                    llm_model: openrouter/free
                    valid_models:
                      - openai/gpt-5.6-terra
                      - openai/gpt-4.1-mini
                      - openai/gpt-4.1
            groundingUnsupportedModel:
              value:
                error:
                  code: grounding_unsupported_model
                  message: LLM model does not support field grounding
                  request_id: req_01h2example
                  retryable: false
                  details:
                    llm_model: vendor/legacy-extract
                    valid_models:
                      - openai/gpt-5.6-terra
                      - openai/gpt-4.1-mini
            encryptedPdf:
              value:
                error:
                  code: encrypted_pdf
                  message: encrypted PDFs are not supported
                  request_id: req_01h2example
                  retryable: false
            invalidSchema:
              value:
                error:
                  code: invalid_schema
                  message: extraction schema is not supported
                  request_id: req_01h2example
                  retryable: false
            groundingUnsupportedSchema:
              value:
                error:
                  code: grounding_unsupported_schema
                  message: extraction schema cannot be transformed safely for field grounding
                  request_id: req_01h2example
                  retryable: false
    UnprocessableOrSyncFailed:
      description: "Admission-time unprocessable configuration/schema/media policy rejection, or (sync\n`POST /parse` and `POST /extract` only) a durable job that reached terminal\n`failed` within the sync wait window. Body is always `ErrorResponse`. Async and batch\nadmissions use `UnprocessableConfig` semantics only; their terminal failures are read\nvia `GET /jobs/{id}`.\n"
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          examples:
            unsupportedModel:
              value:
                error:
                  code: unsupported_ocr_model
                  message: unknown OCR model registry name
                  request_id: req_01h2example
                  retryable: false
                  details:
                    ocr_model: paddleocr-vl-9.9
            unsupportedLlmModel:
              value:
                error:
                  code: unsupported_llm_model
                  message: unknown or deprecated LLM model
                  request_id: req_01h2example
                  retryable: false
                  details:
                    llm_model: openrouter/free
                    valid_models:
                      - openai/gpt-5.6-terra
                      - openai/gpt-4.1-mini
                      - openai/gpt-4.1
            groundingUnsupportedSchema:
              value:
                error:
                  code: grounding_unsupported_schema
                  message: extraction schema cannot be transformed safely for field grounding
                  request_id: req_01h2example
                  retryable: false
            syncFailed:
              value:
                error:
                  code: processing_failed
                  message: OCR parse failed
                  request_id: req_01h2example
                  retryable: false
    SyncTerminalIndeterminate:
      description: "Sync wait observed a durable job terminal status of `indeterminate` (for example an\nambiguous provider acceptance). Body is `ErrorResponse`. Clients should not assume the\noperation can be safely retried without consulting job and billing state.\n"
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          examples:
            indeterminate:
              value:
                error:
                  code: provider_indeterminate
                  message: job outcome indeterminate
                  request_id: req_01h2example
                  retryable: true
    RateLimited:
      description: "Rate or tenant concurrency limit exceeded. Tenant capacity uses\n`tenant_limit_exceeded` when the caller already holds the configured maximum\nof executable non-terminal jobs (`admitting`/`queued`/`running` singles and\nbatch children; batch parents do not count). Idempotent replays of an\nexisting equivalent job are still admitted.\n"
      headers:
        Retry-After:
          description: "Suggested seconds to wait before retrying admission. Present on `429` responses.\n"
          schema:
            type: integer
            minimum: 1
          example: 30
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          examples:
            rate:
              value:
                error:
                  code: rate_limited
                  message: request rate limit exceeded
                  request_id: req_01h2example
                  retryable: true
            tenant:
              value:
                error:
                  code: tenant_limit_exceeded
                  message: tenant in-flight job limit exceeded
                  request_id: req_01h2example
                  retryable: true
                  details:
                    limit: 50
                    current: 50
                    requested: 1
    ServiceUnavailable:
      description: "API admission dependency failure (for example OCR source object upload to dedicated\nstorage). Transient GPU/HPS unavailability is **not** reported as this response —\nknown registry models remain admissible and jobs stay durable/queued; tenant caps and\nqueue alarms bound/observe backlog.\n"
      headers:
        Retry-After:
          description: "Suggested seconds to wait before retrying admission. Present on `503` responses.\n"
          schema:
            type: integer
            minimum: 1
          example: 5
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          examples:
            sourceUploadFailed:
              value:
                error:
                  code: source_upload_failed
                  message: source upload failed
                  request_id: req_01h2example
                  retryable: true
    JobNotFound:
      description: Job not found for the authenticated tenant
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          examples:
            missing:
              value:
                error:
                  code: job_not_found
                  message: job not found
                  request_id: req_01h2example
                  retryable: false
    JobNotTerminal:
      description: |
        The parse job exists but is not yet terminal, so a representation body is not
        available. Poll `GET /jobs/{id}` until `succeeded`, then retry this route.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          examples:
            notTerminal:
              value:
                error:
                  code: job_not_terminal
                  message: parse job is not terminal yet
                  request_id: req_01h2example
                  retryable: true
                  details:
                    status: running
    ParseResultUnavailable:
      description: |
        The requested parse representation is not available without re-running OCR.
        Typical cases: historical jobs that only stored the originally requested
        `output_format`, non-parse jobs, or failed terminals. Clients should request
        the available format (see `details.available_format`) or re-admit a new parse.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          examples:
            formatUnavailable:
              value:
                error:
                  code: result_format_unavailable
                  message: requested parse representation is not available for this job
                  request_id: req_01h2example
                  retryable: false
                  details:
                    requested_format: raw
                    available_format: openparser@1
                    guidance: Re-admit a parse with dual artifacts, or request the available format.
            failed:
              value:
                error:
                  code: processing_failed
                  message: OCR processing failed.
                  request_id: req_01h2example
                  retryable: false
    JobSourceUnavailable:
      description: "Job not found, or retained source bytes are unavailable for the authenticated tenant.\n`job_not_found` covers unknown, malformed, and cross-tenant ids. `source_not_available`\ncovers batch parents, jobs without retained uploads, expired cleanup, and missing storage\nobjects.\n"
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          examples:
            jobNotFound:
              value:
                error:
                  code: job_not_found
                  message: job not found
                  request_id: req_01h2example
                  retryable: false
            sourceNotAvailable:
              value:
                error:
                  code: source_not_available
                  message: job source is not available
                  request_id: req_01h2example
                  retryable: false
    PartialContent:
      description: Partial retained source bytes for a satisfiable `Range` request.
      headers:
        Accept-Ranges:
          description: Always `bytes` for retained job sources.
          schema:
            type: string
            const: bytes
        Content-Range:
          description: Served byte range and total object size.
          schema:
            type: string
          example: bytes 0-1023/1048576
        Content-Type:
          description: Retained source MIME type.
          schema:
            type: string
          example: application/pdf
      content:
        application/octet-stream:
          schema:
            type: string
            format: binary
    RangeNotSatisfiable:
      description: Requested byte range is outside the retained source object.
      headers:
        Accept-Ranges:
