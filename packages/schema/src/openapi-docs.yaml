x-route-docs:
  listOcrModels:
    summary: List OCR models
    description: "Returns the public OCR model registry with capabilities and availability.\nCurrently exposes PaddleOCR-VL 1.6.\n"
  listLlmModels:
    summary: List compatible LLM models
    description: "Returns a cached, normalized OpenRouter catalog filtered to models that advertise\nstrict structured output (`structured_outputs` + `response_format`), have valid finite\nprovider-list cost (internally) that is converted to customer retail rates, produce text, and are not expired.\n\nDefault `mode=suggested` returns a short recommended subset. `mode=search` discovers the\nfull compatible catalog with optional `q` / pagination. Field grounding and schema\nsuggestion remain restricted to certified models.\n"
  parseSync:
    summary: Parse a document synchronously
    description: "Admit a parse job, wait up to the sync wait limit, and return the selected terminal parse\nrepresentation when ready. `output_format` defaults to the versioned provider-neutral\n`openparser@1`; `raw` returns a stable provider envelope around the untouched successful\nPaddle result. Terminal `failed` within the wait window returns `422` `ErrorResponse`;\nterminal `indeterminate` returns `504` `ErrorResponse`. Returns `202` with a durable job\nreference and `Location` if the wait limit expires first.\n\nExample (`multipart/form-data`):\n\n```bash\n__OPENPARSER_PARSE_SYNC_CURL__\n```\n"
    responses:
      '200':
        description: Terminal parse result in the selected `openparser@1` or `raw` representation
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ParsedDocument'
            examples:
              invoice:
                $ref: '#/components/examples/ParsedDocumentInvoice'
  parseAsync:
    summary: Parse a document asynchronously
    description: "Admit a durable parse job and return immediately.\n\nExample (`multipart/form-data`):\n\n```bash\n__OPENPARSER_PARSE_ASYNC_CURL__\n```\n"
  parseBatch:
    summary: Parse multiple documents in one batch
    description: "Admit up to 100 parse child jobs in one durable batch. Every uploaded file must be mapped\nexactly once by `file_index`. Partial child failures are preserved in batch results.\nParent status derivation for mixed outcomes is defined on `JobStatus`.\n"
  extractSync:
    summary: Extract structured data synchronously
    description: "Admit a single extract job from file bytes, `file_id`, or a tenant-owned succeeded\n`parse_job_id`, then run schema-constrained OpenRouter extraction via `llm_model`. A\n`parse_job_id` source reuses the canonical ParsedDocument (from dual artifacts or legacy\n`result_json`) without OCR or another page charge; historical raw-only parses return\n`422 canonical_result_unavailable`. Wait up to the sync wait limit and return\n`ExtractionTerminalResult` when ready. Terminal `failed` within the wait window returns\n`422`; terminal `indeterminate` returns `504`. Returns `202` with a durable job reference\nand `Location` if the wait expires.\n"
    responses:
      '200':
        description: Terminal extraction result
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ExtractionTerminalResult'
            examples:
              invoice:
                $ref: '#/components/examples/ExtractionTerminalResultInvoice'
              groundedInvoice:
                $ref: '#/components/examples/ExtractionTerminalResultGroundedInvoice'
  extractAsync:
    summary: Extract structured data asynchronously
    description: "Admit a durable single extract job from file bytes, `file_id`, or `parse_job_id` and\nreturn immediately. Parse reuse does not run OCR or add a page charge; OpenRouter usage\nremains billable.\n"
  extractBatch:
    summary: Extract structured data from multiple documents
    description: "Admit up to 100 file-backed extract child jobs in one durable batch. Every item uses\n`file_index` or `file_id`; `parse_job_id` reuse is single-extract-only and is not accepted\nin batch. Partial child failures are preserved. Parent status derivation follows\n`JobStatus`; billing is evaluated per child.\n"
  suggestSchema:
    summary: Suggest an extraction schema
    description: "Suggest an extraction JSON Schema from a tenant-owned succeeded parse result.\nOptional `hint` is capped at 500 characters. Definitive failures return\n`schema_suggestion_failed`.\n"
    responses:
      '200':
        description: Suggested schema
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SuggestSchemaResponse'
  createExtractionPipeline:
    summary: Create a saved extraction pipeline
    description: "Persist a tenant-scoped extraction configuration (OCR model, LLM model, schema,\nrepair/grounding/reasoning). Validated with the same admission gates as extract.\nPlayground tokens and `ocr:full` keys are both accepted.\n"
  listExtractionPipelines:
    summary: List saved extraction pipelines
    description: "Return active (non-deleted) pipelines for the authenticated tenant, newest updates first.\n"
  getExtractionPipeline:
    summary: Get a saved extraction pipeline
    description: "Return one active pipeline. Missing, deleted, and cross-tenant ids return\n`404 pipeline_not_found`.\n"
  updateExtractionPipeline:
    summary: Update a saved extraction pipeline
    description: "Patch one or more fields, re-validate the effective merged config, and atomically\nincrement `version`. In-flight and completed jobs keep their admit-time snapshots.\n"
  deleteExtractionPipeline:
    summary: Soft-delete a saved extraction pipeline
    description: "Marks the pipeline deleted. Subsequent extract admits with that id return\n`404 pipeline_not_found`. Historical jobs retain snapshotted config.\n"
  listJobs:
    summary: List jobs
    description: |
      Tenant-scoped chronological list of top-level OCR jobs (batch children are omitted).
      Returns lightweight summaries only — full results remain on `GET /jobs/{id}`.
      Cursor pagination is stable newest-first with an `id` tie-break. Optional `status`
      and `operation` filters are validated strictly; unknown values return `400`.
    responses:
      '200':
        description: Page of job summaries
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/JobListResponse'
  getJob:
    summary: Get job status and result
    description: "Tenant-scoped durable job read. Jobs belonging to another tenant return `404`. Batch jobs\ninclude cursor-paginated child summaries. Playground tokens (`ocr:playground`) and `ocr:full`\nkeys are both accepted. Successful parse jobs return the originally requested `output_format`\nin `result`; use `GET /jobs/{id}/result?format=` to select an alternate stored representation\nwithout re-running OCR.\n"
    responses:
      '200':
        description: 'Job status, progress, and result when available'
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Job'
            examples:
              parseSucceeded:
                $ref: '#/components/examples/JobParseSucceeded'
              batchRunning:
                $ref: '#/components/examples/JobBatchRunning'
              batchMixed:
                $ref: '#/components/examples/JobBatchMixed'
  getJobResult:
    summary: Get a parse job result representation
    description: |
      Return the selected parse wire body for a tenant-owned succeeded parse job.
      `format` defaults to the job's original `output_format`. Fresh dual-artifact parses
      can serve either `openparser@1` or `raw` from object storage without re-running HPS
      or charging pages. Historical jobs only serve the representation already present in
      `result_json`; unavailable alternates return `422 result_format_unavailable` with
      guidance. Non-terminal jobs return `409 job_not_terminal`. Playground tokens
      (`ocr:playground`) and `ocr:full` keys are both accepted.
    responses:
      '200':
        description: Selected parse representation (`ParsedDocument` or `RawParseResult`)
  getJobSource:
    summary: Download retained job source bytes
    description: "Stream the retained source document for a parse or single-document extract job. Jobs without\nretained source bytes return `404 source_not_available`. Check `has_source` on `GET /jobs/{id}`\nbefore calling. Playground tokens (`ocr:playground`) and `ocr:full` keys are both accepted,\nmatching other job read routes. Optional `Range` requests may return `206` partial content or\n`416` when the range is unsatisfiable.\n"
    responses:
      '200':
        description: Full retained source document
  createFile:
    summary: Upload a reusable file
    description: "Upload bytes directly to OpenParser's Eigenpal-compatible tenant file pool. Files may be\nreused by later parse or extract requests through `file_id`; bytes do not pass through\nVercel.\n"
    responses:
      '200':
        description: Uploaded reusable file
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PublicFile'
  getFile:
    summary: Get reusable file metadata
    responses:
      '200':
        description: Reusable file metadata
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PublicFile'
  deleteFile:
    summary: Delete a reusable file
    responses:
      '200':
        description: File deleted
        content:
          application/json:
            schema:
              type: object
              required:
                - deleted
              properties:
                deleted:
                  type: boolean
                  const: true
  getFileContent:
    summary: Download reusable file bytes
    responses:
      '200':
        description: File content
        content:
          application/octet-stream:
            schema:
              type: string
              format: binary
x-schema-docs:
  JobId:
    description: Prefixed public id for an OCR job (`opj_…`).
    example: opj_V1StGXR8_Z5jdHi6B-myT
  OcrModel:
    description: "Stable public OCR model registry name. `paddleocr-vl-1.6` locks\n`formatBlockContent=true`, `visualize=false`, and `returnMarkdownImages=false`.\nPublic `ocr_options` (`image_block_ocr`, `chart_recognition`, `merge_layout_blocks`)\nare admitted per model catalog. Layout-block merging defaults off so text remains\naligned with its detected geometry. Canonical output always retains figure and\nempty-detection geometry in `regions`/`blocks`; binary figure crops are not\ncaller-configurable and are never embedded as base64 in canonical responses.\n"
  LlmModel:
    description: "OpenRouter model slug from the compatible OCR extraction catalog\n(`GET /models/llm`). Unknown or deprecated values return `422 unsupported_llm_model`.\nOrdinary extract may use any currently compatible model; field grounding requires a\ncertified model.\n"
    example: openai/gpt-5.6-terra
  OcrModelCatalogEntry:
    description: "Public OCR model registry entry. `pricing.usd_per_page` is the\ncustomer retail page price (`basis: customer_retail`)."
  OcrModelsResponse:
    description: OCR model discovery response for `GET /models/ocr`.
  OcrLlmModelCatalogEntry:
    description: "One compatible extraction LLM. `recommendation` is `suggested` or `compatible`.\n`certified_grounding` / `certified_suggest` (and compatibility aliases\n`supports_grounding` / `supports_suggest`) gate heavier schemas. `pricing` is customer retail USD per 1M tokens\n(`basis: customer_retail`) — the rates customers are charged, not raw provider list cost.\n"
  OcrLlmModelsResponse:
    description: "Normalized OpenRouter LLM catalog for OpenParser extraction. Includes catalog version,\nstale flag, and pagination metadata for search mode.\n"
  RepairAttempts:
    description: Explicit schema-repair attempts allowed after a concrete invalid JSON/schema response.
  ExtractRequest:
    description: "Single extract config. Provide either `pipeline_id` or inline extraction config.\nThe source is exactly one of multipart file bytes, `file_id`, or tenant-owned succeeded\n`parse_job_id`. Parse reuse is single-extract-only, forbids `ocr_model` / `ocr_options`,\ndoes not run OCR, and adds no page charge. `parse_job_id` is part of idempotency identity.\n"
    properties:
      pipeline_id:
        pattern: '^oppl_[A-Za-z0-9_-]+$'
        description: "Saved extraction pipeline id (`oppl_…`). Inline extraction fields are forbidden.\nAdmission records pipeline id/version provenance and snapshots the effective extraction\nconfiguration; the worker never re-reads the pipeline. With `parse_job_id`, source-parse\nprovenance is recorded separately and the pipeline's OCR settings are not executed.\n"
      parse_job_id:
        pattern: '^opj_[A-Za-z0-9_-]+$'
        description: "Tenant-owned succeeded `parse` job (`opj_…`) whose canonical `openparser@1` ParsedDocument\nis reused. Mutually exclusive with multipart bytes and `file_id`; forbidden in batch.\n"
      grounding:
        description: "Optional field grounding mode. Defaults to `none` for inline requests. Changing\ngrounding with the same Idempotency-Key returns `409 idempotency_conflict`.\nUnsupported schemas return `422 grounding_unsupported_schema`.\n"
  ExtractionPipelineId:
    description: Prefixed public id for a saved extraction pipeline (`oppl_…`).
  CreateExtractionPipelineRequest:
    description: Create a tenant-scoped saved extraction configuration.
    properties:
      schema:
        description: |
          JSON Schema object describing fields to extract. Root must be an object schema with
          explicit `properties` and at least one named property. Admission applies the same
          strict structured-output normalization as extract.
  UpdateExtractionPipelineRequest:
    description: Partial update; at least one field required. Successful updates bump `version`.
    properties:
      schema:
        description: |
          Replacement extraction schema. Root must be an object schema with explicit `properties`
          and at least one named property. Merged pipeline config is re-validated on every update.
  ExtractionPipeline:
    description: Public saved extraction pipeline resource.
    properties:
      schema:
        description: |
          Persisted extraction schema with at least one root property. Normalized for strict
          structured outputs at save time.
  ExtractionPipelineListResponse:
    description: Active pipelines for the authenticated tenant.
  DeleteExtractionPipelineResponse:
    description: Soft-delete acknowledgement.
  JsonSchemaObject:
    description: Supported JSON Schema object describing the requested extraction output.
  FileId:
    description: "Eigenpal reusable file-pool id from `POST /files`. Resolved with the same\ntenant-scoped authorization as `GET /files/{id}/content`. Missing or\ncross-tenant ids return `404 file_not_found`.\n"
  ParseBatchItem:
    properties:
      client_item_id:
        description: Caller-supplied stable identifier for this batch item.
      file_index:
        description: "Zero-based index into the uploaded `files` array. Exactly one of `file_index` or\n`file_id` is required per item.\n"
  ExtractBatchItem:
    description: "Per-item file-backed extract config with the same `pipeline_id` XOR inline rules as\nsingle extract. Sources are `file_index` or `file_id`; `parse_job_id` is not supported\nin batch. No parent-level batch pipeline in v1.\n"
    properties:
      pipeline_id:
        pattern: '^oppl_[A-Za-z0-9_-]+$'
        description: Saved extraction pipeline id; mutually exclusive with inline extract fields.
      file_index:
        description: "Zero-based index into the uploaded `files` array. Exactly one of `file_index` or\n`file_id` is required per item.\n"
      grounding:
        description: "Optional field grounding mode. Defaults to `none`. `field` opts into verified\nper-leaf citations and is part of idempotency identity.\n"
  ParseBatchRequest:
    properties:
      items:
        description: "Ordered batch items. Each item references either an uploaded `files` entry via\n`file_index` or an Eigenpal reusable `file_id`. Uploaded files must be covered by\nexactly one unique `file_index` in `[0, files.length)`.\n"
  ExtractBatchRequest:
    properties:
      items:
        description: "Ordered batch items. Each item references either an uploaded `files` entry via\n`file_index` or an Eigenpal reusable `file_id`.\n"
        items:
          properties:
            pipeline_id:
              pattern: '^oppl_[A-Za-z0-9_-]+$'
  ExtractionGroundingMode:
    description: "Extraction grounding mode. `none` preserves ordinary extraction. `field` requests\nverified per-leaf source citations (citation v1 emits block-level citations only).\n"
  ExtractionCitationGranularity:
    description: "Citation geometry granularity. Citation v1 emits only `block`; `region` is reserved\nfor a later narrowing release.\n"
  ExtractionCitation:
    description: 'Verified provenance for one extracted leaf citation. Geometry comes from the parse, never the model.'
  ExtractionGroundingField:
    description: "Grounding metadata for one leaf in the unwrapped extraction output. `path` uses\ndot-separated property segments and decimal array-index segments, for example\n`line_items.0.amount`.\n"
    properties:
      path:
        description: "Dot-separated path from the output root. Array positions are decimal segments.\nProperty names containing dots are outside the field-grounding schema subset.\n"
  ExtractionGroundingResult:
    description: 'Optional terminal grounding envelope present only when `grounding: field` succeeded.'
  JobStatus:
    description: "Durable job status. For batch parent jobs, status is derived from children after each\nchild transition:\n1. If any child is non-terminal, the parent remains `queued` only while every child is\n   queued; it becomes `running` once any child is running or terminal.\n2. When every child is terminal and any child is `indeterminate`, the parent is\n   `indeterminate`.\n3. When every child is terminal, none are `indeterminate`, and any child is `failed`:\n   the parent is `failed` if zero children succeeded, otherwise `succeeded` (mixed\n   success/failure closes as parent `succeeded` while preserving failed children in\n   summaries).\n4. When every child is `succeeded`, the parent is `succeeded`.\n\nPartial failures are always retained on child summaries; parent status does not drop\nfailed children from results.\n"
  BoundingBox:
    description: Axis-aligned integer page coordinates with exclusive right and bottom edges.
  PageBlock:
    description: "Primary stable parse interface: one ordered page block in reading order. Optional core\nfields are serialized as JSON `null` when absent.\n"
    allOf:
      - if:
          properties:
            kind:
              const: text
          required:
            - kind
        then:
          required:
            - text
          properties:
            text:
              type: string
      - if:
          properties:
            kind:
              const: table
          required:
            - kind
        then:
          required:
            - table_html
          properties:
            table_html:
              type: string
      - if:
          properties:
            kind:
              const: figure
          required:
            - kind
        then:
          required:
            - figure_uri
          properties:
            figure_uri:
              type: string
      - if:
          properties:
            coordinate_width:
              type: integer
        then:
          properties:
            coordinate_height:
              type: integer
      - if:
          properties:
            coordinate_height:
              type: integer
        then:
          properties:
            coordinate_width:
              type: integer
    properties:
      index:
        description: 'Zero-based reading-order index, contiguous from 0.'
  Region:
    allOf:
      - if:
          properties:
            coordinate_width:
              type: integer
        then:
          properties:
            coordinate_height:
              type: integer
      - if:
          properties:
            coordinate_height:
              type: integer
        then:
          properties:
            coordinate_width:
              type: integer
  RegionContent:
    allOf:
      - anyOf:
          - required:
              - text
            properties:
              text:
                type: string
          - required:
              - table_html
            properties:
              table_html:
                type: string
          - required:
              - detected_state
            properties:
              detected_state:
                type: boolean
      - if:
          properties:
            kind:
              const: table
          required:
            - kind
        then:
          required:
            - table_html
          properties:
            table_html:
              type: string
      - if:
          properties:
            kind:
              const: state
          required:
            - kind
        then:
          required:
            - detected_state
          properties:
            detected_state:
              type: boolean
  ExtractionChunk:
    description: "Canonical extraction chunk. `id` and `content_sha256` are lowercase SHA-256 hashes;\n`content_sha256` hashes `text`. Page numbers are sorted and unique. When present,\n`page_start` and `page_end` equal the minimum and maximum `page_numbers`. Region IDs and\nprovenance spans must match the parent document's regions.\n"
    allOf:
      - if:
          properties:
            page_start:
              type: integer
        then:
          properties:
            page_end:
              type: integer
      - if:
          properties:
            page_end:
              type: integer
        then:
          properties:
            page_start:
              type: integer
    properties:
      page_numbers:
        uniqueItems: true
      region_ids:
        uniqueItems: true
  ParsedDocument:
    description: "Versioned OpenParser `openparser@1` document representation. `blocks` is the primary\nstable interface; `regions`, `contents`, and `chunks` preserve provider-neutral geometry,\nconfidence, labels, provenance, and extraction views. Compatible optional fields may be\nadded within version 1; breaking representation changes create a new output-format version.\n"
    properties:
      page_count:
        description: "Authoritative successfully parsed page count from the HPS/parse result. Customer\npage billing uses this value only when a successful terminal result is published.\n"
      markdown:
        description: Derived markdown rendered from ordered blocks.
  ExtractionAttempt:
    properties:
      index:
        description: Zero-based attempt index in execution order.
      cost_usd:
        description: "Customer retail USD for this attempt (OpenRouter provider cost converted to the\nrates customers are charged). Distinct from the OCR page charge.\n"
  ExtractionUsageTotals:
    description: "Aggregated customer retail OpenRouter usage for transparency. `cost_usd` is the\ncustomer charge, not raw provider list cost. Distinct from the customer\nUSD $0.001/page (0.1 credits/page) OCR charge recorded by Eigenpal billing.\n"
  ExtractionTerminalResult:
    description: 'Terminal extraction result returned by sync `200` and embedded in succeeded jobs.'
    properties:
      output:
        description: Validated extraction output JSON matching the requested schema (wrappers never leak).
      parse_job_id:
        description: Present only when extraction reused this source parse job without running OCR again.
      grounding:
        description: "Present only for successful `grounding: field` jobs. Omitted for ordinary extraction.\n"
  SuggestSchemaRequest:
    description: "Suggest an extraction JSON Schema from a tenant-owned succeeded `parse` job.\nOptional `hint` is caller guidance capped at 500 characters.\n"
    properties:
      parse_job_id:
        pattern: '^opj_[A-Za-z0-9_-]+$'
        description: Prefixed id (`opj_…`) of a succeeded `parse` job in the same tenant.
      hint:
        description: Optional free-text guidance for the suggestion model (max 500 characters).
  SuggestSchemaResponse:
    description: Suggested extraction schema returned directly without creating a durable job.
    properties:
      name:
        description: Short document-type label proposed by the model.
      schema:
        description: Canonical JSON Schema object ready for extract and manual editing.
  BatchChildSummary:
    properties:
      result:
        description: 'Terminal child result when `status` is `succeeded`.'
  BatchChildPage:
    properties:
      next_cursor:
        description: Present when more child summaries are available.
  Job:
    properties:
      result:
        description: Terminal result for single-item parse or extract jobs.
      ocr_model:
        description: |
          OCR model used at admit time when recorded. Omitted when unknown. Jobs do not
          expose a durable OCR options snapshot.
      pipeline_id:
        description: |
          Snapshot of the saved extraction pipeline id at admit time, or `null` for parse jobs,
          inline extract config, and other non-pipeline work.
      pipeline_version:
        description: |
          Snapshot of the saved extraction pipeline version at admit time, or `null` when
          `pipeline_id` is `null`.
  JobSummary:
    description: |
      Lightweight list row for `GET /jobs`. Omits result bodies, idempotency keys,
      storage object keys, and provider cost fields.
    properties:
      has_result:
        description: True when `GET /jobs/{id}` includes a terminal `result`.
      url:
        description: Path-absolute job resource URL (for example `/jobs/{id}`).
      pipeline_id:
        description: |
          Snapshot of the saved extraction pipeline id at admit time, or `null` for parse jobs,
          inline extract config, and other non-pipeline work.
      pipeline_version:
        description: |
          Snapshot of the saved extraction pipeline version at admit time, or `null` when
          `pipeline_id` is `null`.
  JobListResponse:
    description: Cursor-paginated page of job summaries for the authenticated tenant.
    properties:
      next_cursor:
        description: Opaque cursor for the next page, or `null` when exhausted.
