[project]
name = "openparser-sdk"
version = "0.1.0"
description = "Parse documents and extract structured data with Python"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Apache-2.0" }
authors = [{ name = "OpenParser", email = "support@openparser.dev" }]
maintainers = [{ name = "OpenParser", email = "support@openparser.dev" }]
keywords = [
    "openparser",
    "sdk",
    "api",
    "client",
    "document-parsing",
    "document-extraction",
    "ocr",
    "ai",
    "llm",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Intended Audience :: Information Technology",
    "License :: OSI Approved :: Apache Software License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: Implementation :: CPython",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Topic :: Internet :: WWW/HTTP",
    "Typing :: Typed",
]
dependencies = [
    "httpx >= 0.24.0, < 0.30.0",
    "attrs >= 21.3.0",
    "python-dateutil >= 2.8.0",
]

[project.urls]
Homepage = "https://openparser.dev"
Documentation = "https://docs.openparser.dev"
Repository = "https://github.com/eigenpal/openparser"
Issues = "https://github.com/eigenpal/openparser/issues"
Changelog = "https://github.com/eigenpal/openparser/blob/main/packages/sdk-python/CHANGELOG.md"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/openparser"]

[tool.hatch.build.targets.wheel.force-include]
"src/openparser/py.typed" = "openparser/py.typed"

[tool.hatch.build.targets.sdist]
include = ["src/openparser", "README.md", "LICENSE"]

[tool.hatch.build.targets.sdist.force-include]
"src/openparser/py.typed" = "src/openparser/py.typed"

[dependency-groups]
dev = [
    "openapi-python-client == 0.28.3",
    "pytest >= 7.0.0",
    "respx >= 0.20.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
