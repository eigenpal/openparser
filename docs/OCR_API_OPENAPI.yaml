paths:
  /models/ocr:
    get:
      operationId: listOcrModels
      tags:
        - models
      summary: List OCR models
      description: "Returns the public OCR model registry with capabilities and availability.\nCurrently exposes PaddleOCR-VL 1.6.\n"
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OcrModelsResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '429':
          $ref: '#/components/responses/RateLimited'
  /models/llm:
    get:
      operationId: listLlmModels
      tags:
        - models
      summary: List compatible LLM models
      description: "Returns a cached, normalized OpenRouter catalog filtered to models that advertise\nstrict structured output (`structured_outputs` + `response_format`), have valid finite\nprovider-list cost (internally) that is converted to customer retail rates, produce text, and are not expired.\n\nDefault `mode=suggested` returns a short recommended subset. `mode=search` discovers the\nfull compatible catalog with optional `q` / pagination. Field grounding and schema\nsuggestion remain restricted to certified models.\n"
      parameters:
        - $ref: '#/components/parameters/LlmModelsMode'
        - $ref: '#/components/parameters/LlmModelsQuery'
        - $ref: '#/components/parameters/LlmModelsPage'
        - $ref: '#/components/parameters/LlmModelsLimit'
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OcrLlmModelsResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '429':
          $ref: '#/components/responses/RateLimited'
  /parse:
    post:
      operationId: parseSync
      tags:
        - parse
      summary: Parse a document synchronously
      description: "Admit a parse job, wait up to the sync wait limit, and return the selected terminal parse\nrepresentation when ready. `output_format` defaults to the versioned provider-neutral\n`openparser@1`; `raw` returns a stable provider envelope around the untouched successful\nPaddle result. Terminal `failed` within the wait window returns `422` `ErrorResponse`;\nterminal `indeterminate` returns `504` `ErrorResponse`. Returns `202` with a durable job\nreference and `Location` if the wait limit expires first.\n\nExample (`multipart/form-data`):\n\n```bash\ncurl -X POST 'https://api.openparser.dev/parse' \\\n  -H 'Authorization: Bearer YOUR_API_KEY' \\\n  -H \"Idempotency-Key: $(uuidgen 2>/dev/null || openssl rand -hex 16)\" \\\n  -F 'request={\"ocr_model\":\"paddleocr-vl-1.6\",\"output_format\":\"openparser@1\"};type=application/json' \\\n  -F 'file=@./document.pdf'\n```\n"
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        $ref: '#/components/requestBodies/ParseSingleUpload'
      responses:
        '200':
          description: 'Terminal parse result in the selected `openparser@1` or `raw` representation'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ParseResult'
              examples:
                invoice:
                  $ref: '#/components/examples/ParsedDocumentInvoice'
        '202':
          $ref: '#/components/responses/JobAccepted'
        '400':
          $ref: '#/components/responses/MalformedRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '402':
          $ref: '#/components/responses/InsufficientCredits'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/IdempotencyConflict'
        '413':
          $ref: '#/components/responses/LimitExceeded'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
        '422':
          $ref: '#/components/responses/UnprocessableOrSyncFailed'
        '429':
          $ref: '#/components/responses/RateLimited'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
        '504':
          $ref: '#/components/responses/SyncTerminalIndeterminate'
  /parse/async:
    post:
      operationId: parseAsync
      tags:
        - parse
      summary: Parse a document asynchronously
      description: "Admit a durable parse job and return immediately.\n\nExample (`multipart/form-data`):\n\n```bash\ncurl -X POST 'https://api.openparser.dev/parse/async' \\\n  -H 'Authorization: Bearer YOUR_API_KEY' \\\n  -H \"Idempotency-Key: $(uuidgen 2>/dev/null || openssl rand -hex 16)\" \\\n  -F 'request={\"ocr_model\":\"paddleocr-vl-1.6\",\"output_format\":\"openparser@1\"};type=application/json' \\\n  -F 'file=@./document.pdf'\n```\n"
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        $ref: '#/components/requestBodies/ParseSingleUpload'
      responses:
        '202':
          $ref: '#/components/responses/JobAccepted'
        '400':
          $ref: '#/components/responses/MalformedRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '402':
          $ref: '#/components/responses/InsufficientCredits'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/IdempotencyConflict'
        '413':
          $ref: '#/components/responses/LimitExceeded'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
        '422':
          $ref: '#/components/responses/UnprocessableConfig'
        '429':
          $ref: '#/components/responses/RateLimited'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
  /parse/batch:
    post:
      operationId: parseBatch
      tags:
        - parse
      summary: Parse multiple documents in one batch
      description: "Admit up to 100 parse child jobs in one durable batch. Every uploaded file must be mapped\nexactly once by `file_index`. Partial child failures are preserved in batch results.\nParent status derivation for mixed outcomes is defined on `JobStatus`.\n"
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        $ref: '#/components/requestBodies/ParseBatchUpload'
      responses:
        '202':
          $ref: '#/components/responses/BatchJobAccepted'
        '400':
          $ref: '#/components/responses/MalformedRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '402':
          $ref: '#/components/responses/InsufficientCredits'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/IdempotencyConflict'
        '413':
          $ref: '#/components/responses/LimitExceeded'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
        '422':
          $ref: '#/components/responses/UnprocessableConfig'
        '429':
          $ref: '#/components/responses/RateLimited'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
  /extract:
    post:
      operationId: extractSync
      tags:
        - extract
      summary: Extract structured data synchronously
      description: "Admit a single extract job from file bytes, `file_id`, or a tenant-owned succeeded\n`parse_job_id`, then run schema-constrained OpenRouter extraction via `llm_model`. A\n`parse_job_id` source reuses the canonical ParsedDocument (from dual artifacts or legacy\n`result_json`) without OCR or another page charge; historical raw-only parses return\n`422 canonical_result_unavailable`. Wait up to the sync wait limit and return\n`ExtractionTerminalResult` when ready. Terminal `failed` within the wait window returns\n`422`; terminal `indeterminate` returns `504`. Returns `202` with a durable job reference\nand `Location` if the wait expires.\n"
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        $ref: '#/components/requestBodies/ExtractSingleUpload'
      responses:
        '200':
          description: Terminal extraction result
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ExtractionTerminalResult'
              examples:
                invoice:
                  $ref: '#/components/examples/ExtractionTerminalResultInvoice'
                groundedInvoice:
                  $ref: '#/components/examples/ExtractionTerminalResultGroundedInvoice'
        '202':
          $ref: '#/components/responses/JobAccepted'
        '400':
          $ref: '#/components/responses/MalformedRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '402':
          $ref: '#/components/responses/InsufficientCredits'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/IdempotencyConflict'
        '413':
          $ref: '#/components/responses/LimitExceeded'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
        '422':
          $ref: '#/components/responses/UnprocessableOrSyncFailed'
        '429':
          $ref: '#/components/responses/RateLimited'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
        '504':
          $ref: '#/components/responses/SyncTerminalIndeterminate'
  /extract/async:
    post:
      operationId: extractAsync
      tags:
        - extract
      summary: Extract structured data asynchronously
      description: "Admit a durable single extract job from file bytes, `file_id`, or `parse_job_id` and\nreturn immediately. Parse reuse does not run OCR or add a page charge; OpenRouter usage\nremains billable.\n"
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        $ref: '#/components/requestBodies/ExtractSingleUpload'
      responses:
        '202':
          $ref: '#/components/responses/JobAccepted'
        '400':
          $ref: '#/components/responses/MalformedRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '402':
          $ref: '#/components/responses/InsufficientCredits'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/IdempotencyConflict'
        '413':
          $ref: '#/components/responses/LimitExceeded'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
        '422':
          $ref: '#/components/responses/UnprocessableConfig'
        '429':
          $ref: '#/components/responses/RateLimited'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
  /extract/batch:
    post:
      operationId: extractBatch
      tags:
        - extract
      summary: Extract structured data from multiple documents
      description: "Admit up to 100 file-backed extract child jobs in one durable batch. Every item uses\n`file_index` or `file_id`; `parse_job_id` reuse is single-extract-only and is not accepted\nin batch. Partial child failures are preserved. Parent status derivation follows\n`JobStatus`; billing is evaluated per child.\n"
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        $ref: '#/components/requestBodies/ExtractBatchUpload'
      responses:
        '202':
          $ref: '#/components/responses/BatchJobAccepted'
        '400':
          $ref: '#/components/responses/MalformedRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '402':
          $ref: '#/components/responses/InsufficientCredits'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/IdempotencyConflict'
        '413':
          $ref: '#/components/responses/LimitExceeded'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
        '422':
          $ref: '#/components/responses/UnprocessableConfig'
        '429':
          $ref: '#/components/responses/RateLimited'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
  /suggest-schema:
    post:
      operationId: suggestSchema
      tags:
        - extract
      summary: Suggest an extraction schema
      description: "Suggest an extraction JSON Schema from a tenant-owned succeeded parse result.\nOptional `hint` is capped at 500 characters. Definitive failures return\n`schema_suggestion_failed`.\n"
      requestBody:
        $ref: '#/components/requestBodies/SuggestSchemaRequest'
      responses:
        '200':
          description: Suggested schema
          content:
