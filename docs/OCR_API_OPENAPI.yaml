      name: id
      in: path
      required: true
      description: Tenant-scoped reusable file identifier.
      schema:
        type: string
        minLength: 1
    PipelineId:
      name: id
      in: path
      required: true
      description: 'Tenant-scoped saved extraction pipeline identifier (`oppl_…`).'
      schema:
        $ref: '#/components/schemas/ExtractionPipelineId'
    ChildCursor:
      name: cursor
      in: query
      required: false
      description: Opaque pagination cursor for batch child summaries.
      schema:
        type: string
        minLength: 1
    ChildLimit:
      name: limit
      in: query
      required: false
      description: Maximum number of batch child summaries to return.
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 50
    JobListCursor:
      name: cursor
      in: query
      required: false
      description: "Opaque pagination cursor from a prior `JobListResponse.next_cursor`. Jobs are\nreturned newest-first (`created_at` descending, `id` descending tie-break).\n"
      schema:
        type: string
        minLength: 1
    JobListLimit:
      name: limit
      in: query
      required: false
      description: Maximum number of job summaries to return.
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 25
    JobListStatus:
      name: status
      in: query
      required: false
      description: "Optional filter by public job status. Admission-phase (`admitting`) jobs are\nnever listed.\n"
      schema:
        $ref: '#/components/schemas/JobStatus'
    JobListOperation:
      name: operation
      in: query
      required: false
      description: Optional filter by job operation.
      schema:
        $ref: '#/components/schemas/JobOperation'
    ParseResultFormat:
      name: format
      in: query
      required: false
      description: "Parse representation to return. Defaults to the job's original `output_format`\nwhen omitted. Fresh parses store both representations as immutable object-store\nartifacts; historical jobs only expose the representation already present in\n`result_json`. Requesting an unavailable alternate returns `422` and never\nre-runs OCR.\n"
      schema:
        $ref: '#/components/schemas/OcrOutputFormat'
    LlmModelsMode:
      name: mode
      in: query
      required: false
      description: "`suggested` (default): short recommended subset.\n`search`: full compatible catalog filtered by `q`.\n"
      schema:
        type: string
        enum:
          - suggested
          - search
        default: suggested
    LlmModelsQuery:
      name: q
      in: query
      required: false
      description: 'Case-insensitive substring match against id, label, or provider. Used with `mode=search`.'
      schema:
        type: string
        maxLength: 200
    LlmModelsPage:
      name: page
      in: query
      required: false
      description: 1-based page index when paginating search results.
      schema:
        type: integer
        minimum: 1
        default: 1
    LlmModelsLimit:
      name: limit
      in: query
      required: false
      description: Page size for search; ignored for suggested mode (bounded server-side).
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 25
  requestBodies:
    ParseSingleUpload:
      required: true
      content:
        multipart/form-data:
          schema:
