    JobStatus:
      type: string
      enum:
        - queued
        - running
        - succeeded
        - failed
        - indeterminate
      description: "Durable job status. For batch parent jobs, status is derived from children after each\nchild transition:\n1. If any child is non-terminal, the parent remains `queued` only while every child is\n   queued; it becomes `running` once any child is running or terminal.\n2. When every child is terminal and any child is `indeterminate`, the parent is\n   `indeterminate`.\n3. When every child is terminal, none are `indeterminate`, and any child is `failed`:\n   the parent is `failed` if zero children succeeded, otherwise `succeeded` (mixed\n   success/failure closes as parent `succeeded` while preserving failed children in\n   summaries).\n4. When every child is `succeeded`, the parent is `succeeded`.\n\nPartial failures are always retained on child summaries; parent status does not drop\nfailed children from results.\n"
    JobOperation:
      type: string
      enum:
        - parse
        - extract
        - parse_batch
        - extract_batch
    JobAccepted:
      type: object
      properties:
        id:
          $ref: '#/components/schemas/JobId'
        operation:
          type: string
