  /jobs:
    get:
      operationId: listJobs
      tags:
        - jobs
      summary: List jobs
      description: "Tenant-scoped chronological list of top-level OCR jobs (batch children are omitted).\nReturns lightweight summaries only — full results remain on `GET /jobs/{id}`.\nCursor pagination is stable newest-first with an `id` tie-break. Optional `status`\nand `operation` filters are validated strictly; unknown values return `400`.\n"
      parameters:
        - $ref: '#/components/parameters/JobListCursor'
        - $ref: '#/components/parameters/JobListLimit'
        - $ref: '#/components/parameters/JobListStatus'
        - $ref: '#/components/parameters/JobListOperation'
      responses:
        '200':
          description: Page of job summaries
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/JobListResponse'
        '400':
          $ref: '#/components/responses/MalformedRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '429':
          $ref: '#/components/responses/RateLimited'
  '/jobs/{id}':
    get:
      operationId: getJob
      tags:
        - jobs
      summary: Get job status and result
      description: "Tenant-scoped durable job read. Jobs belonging to another tenant return `404`. Batch jobs\ninclude cursor-paginated child summaries. Playground tokens (`ocr:playground`) and `ocr:full`\nkeys are both accepted. Successful parse jobs return the originally requested `output_format`\nin `result`; use `GET /jobs/{id}/result?format=` to select an alternate stored representation\nwithout re-running OCR.\n"
      parameters:
        - $ref: '#/components/parameters/JobId'
        - $ref: '#/components/parameters/ChildCursor'
        - $ref: '#/components/parameters/ChildLimit'
      responses:
        '200':
          description: 'Job status, progress, and result when available'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Job'
              examples:
                parseSucceeded:
                  $ref: '#/components/examples/JobParseSucceeded'
                batchRunning:
                  $ref: '#/components/examples/JobBatchRunning'
                batchMixed:
                  $ref: '#/components/examples/JobBatchMixed'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/JobNotFound'
        '429':
          $ref: '#/components/responses/RateLimited'
  '/jobs/{id}/result':
    get:
      operationId: getJobResult
      tags:
        - jobs
      summary: Get a parse job result representation
      description: "Return the selected parse wire body for a tenant-owned succeeded parse job.\n`format` defaults to the job's original `output_format`. Fresh dual-artifact parses\ncan serve either `openparser@1` or `raw` from object storage without re-running HPS\nor charging pages. Historical jobs only serve the representation already present in\n`result_json`; unavailable alternates return `422 result_format_unavailable` with\nguidance. Non-terminal jobs return `409 job_not_terminal`. Playground tokens\n(`ocr:playground`) and `ocr:full` keys are both accepted.\n"
      parameters:
        - $ref: '#/components/parameters/JobId'
        - $ref: '#/components/parameters/ParseResultFormat'
      responses:
        '200':
          description: 'Selected parse representation (`ParsedDocument` or `RawParseResult`)'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ParseResult'
        '400':
          $ref: '#/components/responses/MalformedRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/JobNotFound'
        '409':
          $ref: '#/components/responses/JobNotTerminal'
        '422':
          $ref: '#/components/responses/ParseResultUnavailable'
        '429':
          $ref: '#/components/responses/RateLimited'
        '504':
          $ref: '#/components/responses/SyncTerminalIndeterminate'
  '/jobs/{id}/source':
    get:
      operationId: getJobSource
      tags:
        - jobs
      summary: Download retained job source bytes
      description: "Stream the retained source document for a parse or single-document extract job. Jobs without\nretained source bytes return `404 source_not_available`. Check `has_source` on `GET /jobs/{id}`\nbefore calling. Playground tokens (`ocr:playground`) and `ocr:full` keys are both accepted,\nmatching other job read routes. Optional `Range` requests may return `206` partial content or\n`416` when the range is unsatisfiable.\n"
      parameters:
        - $ref: '#/components/parameters/JobId'
      responses:
        '200':
          description: Full retained source document
          content:
            application/octet-stream:
              schema:
                type: string
                format: binary
        '206':
          $ref: '#/components/responses/PartialContent'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/JobSourceUnavailable'
        '416':
